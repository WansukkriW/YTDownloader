<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' https: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ดาวน์โหลด MP3 / MP4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="m16 10.5 5-3v9l-5-3"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2h7.5A2.5 2.5 0 0 1 21 9.5v7a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5v.01"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  </svg>

  <main>
    <header class="top">
      <div class="mark"><svg><use href="#i-down"/></svg></div>
      <div>
        <h1>ดาวน์โหลด</h1>
        <p class="muted">YouTube, Facebook, TikTok และอีกหลายเว็บ</p>
      </div>
    </header>

    <section class="card form">
      <label class="field-label" for="url">ลิงก์</label>
      <div class="url-box" id="urlBox">
        <svg class="lead"><use href="#i-link"/></svg>
        <input id="url" type="text" placeholder="วางลิงก์คลิปหรือเพลย์ลิสต์" spellcheck="false" autocomplete="off">
        <button id="clear" class="icon-btn" title="ล้าง" hidden><svg><use href="#i-x"/></svg></button>
        <button id="paste" class="text-btn">วาง</button>
      </div>
      <p id="urlHint" class="hint"></p>

      <span class="field-label">บันทึกเป็น</span>
      <div class="formats" role="radiogroup">
        <label class="fmt">
          <input type="radio" name="kind" value="mp4" checked>
          <span class="fmt-body">
            <svg><use href="#i-video"/></svg>
            <span><b>วิดีโอ</b><small>MP4 · ภาพและเสียง</small></span>
          </span>
        </label>
        <label class="fmt">
          <input type="radio" name="kind" value="mp3">
          <span class="fmt-body">
            <svg><use href="#i-music"/></svg>
            <span><b>เพลง</b><small>MP3 · เฉพาะเสียง</small></span>
          </span>
        </label>
      </div>

      <span class="field-label">คุณภาพ</span>
      <div class="seg" id="videoQ" role="radiogroup">
        <label><input type="radio" name="vq" value="360"><span>360p</span></label>
        <label><input type="radio" name="vq" value="720"><span>720p</span></label>
        <label><input type="radio" name="vq" value="1080" checked><span>1080p</span></label>
        <label><input type="radio" name="vq" value="best"><span>สูงสุด</span></label>
      </div>
      <div class="seg" id="audioQ" role="radiogroup" hidden>
        <label><input type="radio" name="aq" value="128"><span>128 kbps</span></label>
        <label><input type="radio" name="aq" value="192"><span>192 kbps</span></label>
        <label><input type="radio" name="aq" value="320" checked><span>320 kbps</span></label>
      </div>

      <label class="switch-row">
        <span>
          <b>โหลดทั้งเพลย์ลิสต์</b>
          <small>เมื่อลิงก์อยู่ในเพลย์ลิสต์ จะโหลดทุกคลิปลงโฟลเดอร์เดียวกัน</small>
        </span>
        <input id="playlist" type="checkbox" class="switch">
      </label>

      <button id="go" class="primary">
        <svg><use href="#i-down"/></svg><span id="goText">ดาวน์โหลด</span>
      </button>
    </section>

    <section class="card now" id="now" hidden>
      <div class="now-row">
        <div class="thumb" id="thumb"></div>
        <div class="now-info">
          <div class="now-title" id="nowTitle">กำลังเตรียม…</div>
          <div class="now-meta" id="nowMeta"></div>
        </div>
      </div>
      <div class="bar"><div id="fill"></div></div>
    </section>

    <section class="card alert" id="alert" hidden>
      <svg><use href="#i-alert"/></svg>
      <div>
        <b id="alertTitle"></b>
        <p id="alertText"></p>
        <button class="link" id="toggleLog">ดูรายละเอียด</button>
        <pre id="log" hidden></pre>
      </div>
    </section>

    <section class="history" id="historyWrap" hidden>
      <div class="history-head">
        <h2>ดาวน์โหลดแล้ว</h2>
        <button class="link" id="clearHistory">ล้างรายการ</button>
      </div>
      <ul id="history"></ul>
    </section>

    <footer>
      <span class="muted" id="outdir"></span>
      <button class="text-btn" id="folder"><svg><use href="#i-folder"/></svg>เปิดโฟลเดอร์</button>
    </footer>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="renderer.js"></script>
</body>
</html>
